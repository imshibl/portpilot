name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, for example v0.1.0"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manual version and test its existing tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like vMAJOR.MINOR.PATCH, for example v0.1.0."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null; then
            git fetch origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
            git checkout "$RELEASE_VERSION"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Create release tag for a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null; then
            git fetch origin "refs/tags/$RELEASE_VERSION:refs/tags/$RELEASE_VERSION"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$RELEASE_VERSION" --message "Release $RELEASE_VERSION" "$GITHUB_SHA"
            git push origin "$RELEASE_VERSION"
          fi
          git checkout "$RELEASE_VERSION"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --dist .goreleaser-dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
